name: Enterpreneur News Panel

on:
  push:
    branches:
      - staging

  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_iEr24X0GZJTAuKDkUG6irzgH
  VERCEL_PROJECT_ID: prj_a3j41oK2p5hjGXBqkQP3ptOV4FQW

jobs:
  Vercel-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=03M2hyeoC6eSBugy1FhT1xA7

      - name: Build Project Artifacts
        run: vercel build --prod --token=03M2hyeoC6eSBugy1FhT1xA7

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=03M2hyeoC6eSBugy1FhT1xA7
